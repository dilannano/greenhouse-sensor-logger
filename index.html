<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenLog Sensor Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-icon">🌱</span>
          <h1>GreenLog <span class="brand-sub">Greenhouse Sensor Logger</span></h1>
        </div>
        <div class="header-status">
          Logged Readings: <span id="log-count" class="count-badge">0</span>
        </div>
      </div>
    </header>

    <main class="dashboard">
      <aside class="panel form-panel">
        <h2 class="panel-title">New Sensor Reading</h2>
      </aside>

      <section class="panel log-panel">
        <h2 class="panel-title">Reading Log</h2>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 GreenLog Greenhouse Monitoring</p>
    </footer>
  </body>
</html>
