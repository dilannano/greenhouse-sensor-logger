<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenLog Sensor Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-icon">🌱</span>
          <h1>GreenLog <span class="brand-sub">Greenhouse Sensor Logger</span></h1>
        </div>
        <div class="header-status">
          Logged Readings: <span id="log-count" class="count-badge">0</span>
        </div>
      </div>
    </header>

    <main class="dashboard">
      <aside class="panel form-panel">
        <h2 class="panel-title">New Sensor Reading</h2>

        <div
          id="form-error-banner"
          class="alert alert-error hidden"
          role="alert"
        ></div>

        <form action="#" id="sensor-form" novalidate>
          <div class="form-group">
            <label for="zone-name" class="form-label"
              >Zone / Bed Name <span class="required">*</span></label
            >
            <input
              type="text"
              name="zone-name"
              id="zone-name"
              class="form-control"
              placeholder="e.g. Tomato Bed A"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="air-temp" class="form-label"
                >Air Temp (°C) <span class="required">*</span></label
              >
              <input
                type="number"
                name="air-temp"
                id="air-temp"
                class="form-control"
                min="-10"
                max="50"
                step="0.1"
                placeholder="24"
                required
              />
            </div>
            <div class="form-group">
              <label for="humidity" class="form-label"
                >Humidity (%) <span class="required">*</span></label
              >
              <input
                type="number"
                name="humidity"
                id="humidity"
                class="form-control"
                min="0"
                max="100"
                placeholder="65"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="soil-ph" class="form-label"
                >Soil pH <span class="required">*</span></label
              >
              <input
                type="number"
                name="soil-ph"
                id="soil-ph"
                class="form-control"
                min="0"
                max="14"
                step="0.1"
                placeholder="6.2"
                required
              />
            </div>
            <div class="form-group">
              <label for="soil-ec" class="form-label"
                >EC (mS/cm) <span class="required">*</span></label
              >
              <input
                type="number"
                name="soil-ec"
                id="soil-ec"
                class="form-control"
                min="0"
                max="10"
                step="0.1"
                placeholder="1.8"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="soil-moisture" class="form-label"
              >Soil Moisture (%) <span class="required">*</span></label
            >
            <input
              type="number"
              name="soil-moisture"
              id="soil-moisture"
              class="form-control"
              min="0"
              max="100"
              placeholder="40"
              required
            />
          </div>

          <button type="submit" id="btn-submit" class="btn btn-primary btn-block">
            Log Sensor Reading
          </button>
        </form>
      </aside>

      <section class="panel log-panel">
        <h2 class="panel-title">Reading Log</h2>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 GreenLog Greenhouse Monitoring</p>
    </footer>
  </body>
</html>
