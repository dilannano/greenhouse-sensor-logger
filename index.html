<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenhouse Sensor Logger</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-icon">🌱</span>
          <h1>Greenhouse Sensor Logger</h1>
        </div>
        <p class="header-status">
          Total Logs: <span id="log-count" class="count-badge">0</span>
        </p>
      </div>
    </header>

    <main class="dashboard">
      <section class="panel form-panel">
        <h2 class="panel-title">Record Sensor Reading</h2>

        <div
          id="error-message"
          class="alert alert-error hidden"
          role="alert"
        ></div>

        <form action="#" id="sensor-form" novalidate>
          <div class="form-group">
            <label for="bay" class="form-label"
              >Bay <span class="required">*</span></label
            >
            <select id="bay" name="bay" class="form-control" required>
              <option value="" selected disabled>Select a bay</option>
              <option value="Bay 1">Bay 1</option>
              <option value="Bay 2">Bay 2</option>
              <option value="Bay 3">Bay 3</option>
              <option value="Bay 4">Bay 4</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ph" class="form-label"
                >pH <span class="required">*</span></label
              >
              <input
                type="number"
                name="ph"
                id="ph"
                class="form-control"
                min="0"
                max="14"
                step="0.1"
                placeholder="6.0"
                required
              />
            </div>
            <div class="form-group">
              <label for="ec" class="form-label"
                >EC (mS/cm) <span class="required">*</span></label
              >
              <input
                type="number"
                name="ec"
                id="ec"
                class="form-control"
                min="0"
                max="10"
                step="0.1"
                placeholder="1.5"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="temp" class="form-label"
                >Temp (°F) <span class="required">*</span></label
              >
              <input
                type="number"
                name="temp"
                id="temp"
                class="form-control"
                min="-40"
                max="140"
                step="0.1"
                placeholder="68"
                required
              />
            </div>
            <div class="form-group">
              <label for="humidity" class="form-label"
                >Humidity (%) <span class="required">*</span></label
              >
              <input
                type="number"
                name="humidity"
                id="humidity"
                class="form-control"
                min="0"
                max="100"
                step="1"
                placeholder="60"
                required
              />
            </div>
          </div>

          <button type="submit" id="btn-submit" class="btn btn-primary btn-block">
            Record Reading
          </button>
        </form>
      </section>

      <section class="panel log-panel">
        <div class="log-header">
          <h2 class="panel-title">Sensor Logs</h2>
          <button id="btn-clear" class="btn btn-outline-danger btn-sm">
            Clear All
          </button>
        </div>

        <p id="empty-message" class="empty-state">No readings yet.</p>

        <ul id="log-list" class="readings-grid" aria-live="polite"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>CSI 3150 Assignment 2</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
